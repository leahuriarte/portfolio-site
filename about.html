<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Leah Uriarte</title>
    <meta name="description" content="Learn more about Leah Uriarte - Computer Science student at Harvey Mudd College, Google intern, and quantum computing researcher.">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TQCD722W1F"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-TQCD722W1F');
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        #tiger-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }
        .tiger-avatar {
            position: fixed;
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }
        .tiger-avatar img {
            width: 360px;
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        /* On narrow screens, stack the avatar at the top-center so it
           doesn't overlap the text column (which drops below it). Use
           absolute (not fixed) so it scrolls away with the page. */
        @media (max-width: 1000px) {
            .tiger-avatar {
                position: absolute;
                top: 130px;
                left: 50%;
                transform: translateX(-50%);
            }
            .tiger-avatar img {
                width: 300px;
            }
        }
        /* Gives the document real height so the page can scroll; the canvas
           text/tiger are drawn fixed and offset by scrollY in JS. */
        #about-spacer {
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="nav-btn">home</a>
        <div class="nav-dropdown">
            <a href="about.html" class="nav-btn active">about me</a>
            <div class="dropdown-menu">
                <a href="about.html" class="dropdown-item">about me</a>
                <a href="chat.html" class="dropdown-item">my interests</a>
                <a href="world.html" class="dropdown-item">commander around the world</a>
            </div>
        </div>
        <a href="projects.html" class="nav-btn">projects</a>
        <a href="resume.html" class="nav-btn">resume</a>
    </nav>

    <!-- Tiger canvas: renders about-me text + walking tiger -->
    <canvas id="tiger-canvas"></canvas>

    <!-- Avatar stays as HTML overlay, clear of the text column -->
    <div class="tiger-avatar">
        <img src="images/avatar-bitmap.png" alt="Leah's Avatar">
    </div>

    <!-- Sized by JS to the full canvas content height so the page scrolls -->
    <div id="about-spacer" aria-hidden="true"></div>

    <script type="module" src="tiger-about.js?v=4"></script>
    <script src="script.js"></script>
</body>

</html>
